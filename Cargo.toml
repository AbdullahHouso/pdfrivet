[workspace]
resolver = "3"
members = ["crates/rivet-core", "crates/rivet-cli", "xtask", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
repository = "https://github.com/AbdullahHouso/rivet-pdf"
authors = ["Abdullah Houso"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# pdfium-render with a small patch that exposes raw PDFium handles (needed for form filling).
# Fork: https://github.com/AbdullahHouso/pdfium-render/tree/rivet/expose-raw-handles
# Remove this once the change is available in an official pdfium-render release.
[patch.crates-io]
pdfium-render = { git = "https://github.com/AbdullahHouso/pdfium-render", rev = "47ad7487de011de2ae5b7955d03921c9c3ab1ec9" }
