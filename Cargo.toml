[workspace]
resolver = "3"
members = ["crates/rivet-core", "crates/rivet-cli", "xtask", "app/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
repository = "https://github.com/AbdullahHouso/rivet-pdf"
authors = ["Abdullah Houso"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
