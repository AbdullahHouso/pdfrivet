[workspace]
resolver = "3"
members = ["crates/rivet-core", "crates/rivet-cli", "xtask", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
repository = "https://github.com/AbdullahHouso/pdfrivet"
authors = ["Abdullah Houso"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Development builds: keep enough debug info for readable panics and backtraces in
# our own code, but none for the hundreds of dependencies. This cuts target/ from
# tens of GB to a few GB and speeds up linking.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# pdfium-render with a small patch that exposes raw PDFium handles (needed for form filling).
# Fork: https://github.com/AbdullahHouso/pdfium-render/tree/rivet/expose-raw-handles
# Remove this once the change is available in an official pdfium-render release.
[patch.crates-io]
pdfium-render = { git = "https://github.com/AbdullahHouso/pdfium-render", rev = "6b12ee53f3365d63c1054f7b2075d801626ce124" }
