[workspace]
resolver = "3"
members = ["crates/rivet-core", "crates/rivet-cli", "xtask", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
repository = "https://github.com/AbdullahHouso/pdfrivet"
authors = ["Abdullah Houso"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Development builds: keep enough debug info for readable panics and backtraces in
# our own code, but none for the hundreds of dependencies. This cuts target/ from
# tens of GB to a few GB and speeds up linking.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# pdfium-render from upstream's main branch: it has the raw-handle accessors
# (`PdfiumLibraryBindings::get_handle_from_*`, our PRs #276/#277, merged) that
# form filling and page moves need. Switch back to crates.io once 0.9.5 is out.
[patch.crates-io]
pdfium-render = { git = "https://github.com/ajrcarey/pdfium-render", rev = "ea2961cb8ac777bb1a06dddb8efd272d34d74f18" }
