name: Release

# Push a tag like v0.1.0 to build installers for every platform.
# They are attached to a *draft* GitHub Release, which you review and publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            pdfium: win-x64
            args: ""
          - name: Linux
            # The oldest supported Ubuntu, so the AppImage runs on more distributions.
            os: ubuntu-22.04
            pdfium: linux-x64
            args: ""
          - name: macOS
            os: macos-latest
            pdfium: mac-univ
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2

      - name: Install UI dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Download PDFium
        run: cargo xtask fetch-pdfium --platform ${{ matrix.pdfium }}

      # This version's section of CHANGELOG.md becomes the release notes, which the app's
      # update dialog also shows ("What's new").
      - name: Release notes
        id: notes
        shell: bash
        run: |
          version=$(jq -r .version app/package.json)
          notes=$(awk -v v="[$version]" '/^## /{found = index($0, v) > 0; next} found' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $version"; exit 1
          fi
          { echo "body<<NOTES_END"; echo "$notes" | sed '/./,$!d'; echo "NOTES_END"; } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          # Lets the action create the draft release and upload the installers.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files; the app only installs updates with a valid signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          # A manual run (not from a tag) names the draft after the version in package.json.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: PDFRivet ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          # The app looks for updates in the latest *published, non-prerelease* release
          # (`latest.json`, written by this action).
          prerelease: false
          updaterJsonPreferNsis: true
