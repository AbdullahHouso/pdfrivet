# cargo-deny: checks dependencies for license problems, security advisories
# and untrusted sources. Run: cargo deny check

[graph]
all-features = false

[advisories]
# Security advisories from the RustSec database are errors.
version = 2
ignore = [
    # proc-macro-error is unmaintained. It comes from Tauri's Linux GTK bindings
    # (gtk-rs 0.18), so it goes away when Tauri upgrades them.
    { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk 0.18; build-time only" },
]

[licenses]
version = 2
# Licenses compatible with Rivet's MPL-2.0. Add new ones only after checking compatibility.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# pdfium-render with a small patch (see [patch.crates-io] in Cargo.toml).
allow-git = ["https://github.com/AbdullahHouso/pdfium-render"]
