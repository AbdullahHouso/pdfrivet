[package]
name = "rivet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PDF engine for Rivet: open, render and edit PDFs (built on PDFium)."

[dependencies]
# Only the image types, no decoders: signature pictures arrive as raw RGBA pixels.
image = { version = "0.25.10", default-features = false }
lopdf = { version = "0.45.0", default-features = false }
lru = "0.18.5"
pdfium-render = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
ts-rs = "12.0.1"
unicode-normalization = "0.1.25"

[lints]
workspace = true

# Windows printing: PDFium draws straight onto the printer (FPDF_RenderPage with a printer DC).
[target.'cfg(windows)'.dependencies]
pdfium-render = { version = "0.9.4", features = ["pdfium_use_win32"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_Xps",
] }
