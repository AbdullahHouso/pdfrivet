[package]
name = "rivet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PDF engine for Rivet: open, render and edit PDFs (built on PDFium)."

[dependencies]
# Text boxes: shaping text (Arabic joining, ligatures, right-to-left order)
# with HarfRust, and reading fonts (names, outlines) with skrifa.
harfrust = "0.14.0"
# The random key of password-protected files (already used by lopdf's encryption).
getrandom = "0.4.3"
# Image types (signature pictures arrive as raw RGBA pixels), the JPEG
# encoder for redacted areas, and the formats Images to PDF reads and
# pages are saved as.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
lopdf = { version = "0.45.0", default-features = false }
lru = "0.18.5"
# Installed fonts are memory-mapped while scanning, so only the tables read are loaded.
memmap2 = "0.9.11"
pdfium-render = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
skrifa = "0.48.0"
thiserror = "2.0.21"
ts-rs = "12.0.1"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-normalization = "0.1.25"

[lints]
workspace = true

# Windows printing: PDFium draws straight onto the printer (FPDF_RenderPage with a printer DC).
[target.'cfg(windows)'.dependencies]
pdfium-render = { version = "0.9.4", features = ["pdfium_use_win32"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_Xps",
] }
