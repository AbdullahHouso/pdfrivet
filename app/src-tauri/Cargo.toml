[package]
name = "rivet-app"
description = "PDFRivet: a free, fast PDF reader and editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "rivet_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = "2.7.1"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rivet-core = { path = "../../crates/rivet-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tauri = "2.12.1"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-store = "2.5.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-process = "2.4.0"

# Windows: each tab's own preview in the taskbar (src/taskbar_tabs.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# HTML to PDF: WebView2's "print to PDF" (src/html_pdf.rs); the version wry uses.
webview2-com = "0.39.1"

# HTML to PDF on Linux: WebKitGTK printing to a file (src/html_pdf.rs); the versions wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = { version = "2.0.2", features = ["v2_38"] }

# macOS: asking Launch Services which app opens PDFs (src/default_app.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
# HTML to PDF: WKWebView's print operation, saved without a panel (src/html_pdf.rs); the versions wry uses.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["std", "NSString", "NSURL", "NSGeometry", "NSDictionary"] }
objc2-app-kit = { version = "0.3.2", features = ["std", "NSPrintInfo", "NSPrintOperation", "NSView", "NSResponder"] }
objc2-web-kit = { version = "0.3.2", features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKPreferences"] }

# Self-update exists only on desktop.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.13.2"
